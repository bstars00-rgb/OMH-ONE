name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, translations, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Both languages present, placeholders matched, no enum key gaps.
      - name: Translation audit
        run: npm run i18n:audit

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-secret-not-used-at-runtime

  test:
    name: Route sweep and security assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Migrations run and the demo dataset is generated against embedded
      # PostgreSQL (PGlite), so CI needs no database service container.
      - name: Set up database
        run: npm run db:setup
        env:
          DB_DRIVER: pglite

      - name: Start server
        run: |
          npm run dev > /tmp/server.log 2>&1 &
          npx wait-on http://localhost:3000/login --timeout 120000
        env:
          ENABLE_TEST_LOGIN: '1'
          AUTH_SECRET: ci-test-secret
          DB_DRIVER: pglite

      # 7 roles x 27 pages x 2 languages, plus 10 report endpoints. Also fails
      # on any message key that reaches the DOM as text.
      - name: Route sweep
        run: npm run test:routes

      # Proves permissions restrict data, not just navigation.
      - name: Security assertions
        run: npm run test:rbac

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/server.log
